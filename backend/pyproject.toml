[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-ai-backend"
version = "0.1.0"
dependencies = ["fastapi", "uvicorn", "PyJWT[crypto]", "python-dotenv", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
